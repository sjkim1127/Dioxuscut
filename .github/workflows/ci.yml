name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  wasm:
    name: Web (wasm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check Dioxus Web core
        run: cargo check --locked -p dioxuscut-core --features web --target wasm32-unknown-unknown

  # ── 1. Code Formatting & Clippy Lints ─────────────────────────────────────
  fmt_clippy:
    name: Code Quality (Fmt & Clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus desktop dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare Tauri frontend directory for macro checks
        run: mkdir -p apps/studio-tauri/dist

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # ── 2. Cross-Platform Unit & Integration Tests ──────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: fmt_clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Prepare Tauri frontend directory for macro checks
        run: mkdir -p apps/studio-tauri/dist

      - name: Cargo Check Workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run All Workspace Tests
        run: cargo test --locked --workspace --exclude dioxuscut-python

  # ── 3. Tauri app bundle and bundled browser worker ────────────────────────
  tauri_app_bundle:
    name: Tauri macOS app bundle
    runs-on: macos-latest
    needs: [fmt_clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/studio-tauri

      - name: Build Tauri app bundle
        run: npm run tauri -- build --debug --bundles app
        working-directory: apps/studio-tauri

      - name: Verify bundled browser worker
        run: test -f "target/debug/bundle/macos/Dioxuscut Studio.app/Contents/Resources/_up_/scripts/three-render-worker.mjs"

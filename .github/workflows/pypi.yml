name: CI & PyPI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/python/Cargo.toml
          sccache: 'true'
          manylinux: auto
      - name: Install FFmpeg (Linux)
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Smoke test wheel (x86_64 native)
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install dist/*.whl
          python3 crates/python/tests/test_binding.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/python/Cargo.toml
          sccache: 'true'
      - name: Install FFmpeg (macOS)
        if: matrix.platform.target == 'aarch64-apple-darwin'
        run: brew install ffmpeg
      - name: Smoke test wheel (Apple Silicon native)
        if: matrix.platform.target == 'aarch64-apple-darwin'
        run: |
          pip install dist/*.whl
          python3 crates/python/tests/test_binding.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/python/Cargo.toml
          sccache: 'true'
      - name: Install FFmpeg (Windows)
        run: choco install ffmpeg -y
      - name: Smoke test wheel (x64 native)
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          pip install dist/*.whl
          python crates/python/tests/test_binding.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

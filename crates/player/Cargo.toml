[package]
name        = "dioxuscut-player"
description = "Interactive video player component for Dioxuscut"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
dioxus             = { workspace = true }
dioxuscut-core      = { workspace = true }
dioxuscut-animation = { workspace = true }
dioxuscut-composition = { workspace = true }
dioxuscut-rasterizer  = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
# The player only needs the timer runtime. Keeping Tokio's default/full
# networking features out of the wasm graph avoids pulling mio, which has no
# browser socket backend.
tokio              = { version = "1", default-features = false, features = ["rt", "time"] }

[package]
name = "dioxuscut-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python native bindings for Dioxuscut programmatic video engine"
repository = "https://github.com/sjkim1127/rust-motion"
readme = "README.md"
publish = false

[lib]
name = "_dioxuscut"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

dioxuscut-animation = { workspace = true }
dioxuscut-captions = { workspace = true, default-features = false }
dioxuscut-cli = { workspace = true, features = ["rhai"] }
dioxuscut-composition = { workspace = true }
dioxuscut-media = { workspace = true, default-features = false }
dioxuscut-paths = { workspace = true }
dioxuscut-rasterizer = { workspace = true }
dioxuscut-shapes = { workspace = true, default-features = false }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[package]
name = "dioxuscut-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python native bindings for Dioxuscut programmatic video engine"
repository = "https://github.com/sjkim1127/Dioxuscut"
readme = "README.md"

[lib]
name = "_dioxuscut"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

dioxuscut-animation = { workspace = true }
dioxuscut-cli = { workspace = true, features = ["rhai"] }
dioxuscut-composition = { workspace = true }
dioxuscut-core = { workspace = true }
dioxuscut-rasterizer = { workspace = true }
